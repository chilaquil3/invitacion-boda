<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vanesa & Diego Armando | Nuestra Boda</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap"
        rel="stylesheet"
    >

    <style>

        /* ==================================================
           COLORES
        ================================================== */

        :root {

            --ivory: #faf6ef;
            --ink: #332b25;
            --ink-soft: #55483a;

            --gold: #a9812f;
            --gold-light: #c9a86a;

            --rose: #b8836f;

        }


        /* ==================================================
           CONFIGURACIÓN GENERAL
        ================================================== */

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            width: 100%;

            min-height: 100vh;

            overflow-x: hidden;

            font-family:
                'Cormorant Garamond',
                serif;

            color: var(--ink);

            background:

                radial-gradient(
                    circle at top,
                    #eee5d5,
                    #d5c8ae
                );

        }


        /* ==================================================
           CARTA
        ================================================== */

        .welcome-card {

            position: relative;

            width: min(900px, 100%);

            min-height: 100vh;

            margin: 0 auto;

            overflow: hidden;

            /*
             * AQUÍ ESTÁ LA IMAGEN DE FONDO
             *
             * La primera capa es una capa crema
             * transparente.
             *
             * La segunda es tu imagen.
             */

            background-image:

                linear-gradient(
                    rgba(250, 246, 239, 0.62),
                    rgba(250, 246, 239, 0.62)
                ),

                url("dibujitos.png");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: scroll;

            box-shadow:

                0 20px 60px
                rgba(0, 0, 0, 0.22);

        }


        /* ==================================================
           MARCO INTERIOR
        ================================================== */

        .frame {

            position: absolute;

            inset: 14px;

            border:
                1px solid
                rgba(169, 129, 47, 0.45);

            pointer-events: none;

            z-index: 20;

        }


        .frame::before {

            content: "";

            position: absolute;

            inset: 7px;

            border:
                1px solid
                rgba(169, 129, 47, 0.25);

        }


        /* ==================================================
           ESQUINAS DECORATIVAS
        ================================================== */

        .corner {

            position: absolute;

            width: 65px;

            height: 65px;

            border-color:
                var(--gold);

            opacity: 0.65;

            z-index: 25;

        }


        .top-left {

            top: 5px;

            left: 5px;

            border-top:
                2px solid;

            border-left:
                2px solid;

        }


        .top-right {

            top: 5px;

            right: 5px;

            border-top:
                2px solid;

            border-right:
                2px solid;

        }


        .bottom-left {

            bottom: 5px;

            left: 5px;

            border-bottom:
                2px solid;

            border-left:
                2px solid;

        }


        .bottom-right {

            bottom: 5px;

            right: 5px;

            border-bottom:
                2px solid;

            border-right:
                2px solid;

        }


        /* ==================================================
           CONTENIDO
        ================================================== */

        .content {

            position: relative;

            z-index: 10;

            width: 100%;

            max-width: 760px;

            min-height: 100vh;

            margin: 0 auto;

            padding:

                clamp(70px, 9vw, 110px)

                clamp(30px, 8vw, 80px)

                80px;

            text-align: center;

        }


        /* ==================================================
           ENCABEZADO
        ================================================== */

        .small-title {

            font-size:
                clamp(15px, 2vw, 19px);

            font-style: italic;

            letter-spacing:
                0.16em;

            color:
                var(--rose);

            margin-bottom: 20px;

            text-shadow:
                0 1px 5px
                rgba(255,255,255,.8);

        }


        /* ==================================================
           NOMBRES
        ================================================== */

        h1 {

            font-family:
                'Great Vibes',
                cursive;

            font-weight: 400;

            font-size:
                clamp(
                    55px,
                    9vw,
                    92px
                );

            line-height: 0.85;

            color:
                var(--gold);

            text-shadow:

                0 2px 4px
                rgba(255,255,255,.9),

                0 3px 8px
                rgba(80,50,20,.15);

        }


        .amp {

            display: block;

            font-size:
                clamp(
                    35px,
                    5vw,
                    46px
                );

            color:
                var(--rose);

            margin:
                7px 0;

        }


        /* ==================================================
           DIVISOR
        ================================================== */

        .divider {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            width:
                min(500px, 85%);

            margin:
                30px auto;

        }


        .line {

            height: 1px;

            flex: 1;

            background:

                linear-gradient(
                    to right,
                    transparent,
                    var(--gold-light)
                );

        }


        .line.right {

            background:

                linear-gradient(
                    to left,
                    transparent,
                    var(--gold-light)
                );

        }


        .diamond {

            width: 8px;

            height: 8px;

            flex-shrink: 0;

            background:
                var(--gold);

            transform:
                rotate(45deg);

            box-shadow:
                0 1px 4px
                rgba(80,50,20,.2);

        }


        /* ==================================================
           FECHA
        ================================================== */

        .date {

            font-size:
                clamp(
                    19px,
                    3vw,
                    24px
                );

            line-height: 1.4;

            letter-spacing:
                0.06em;

            color:
                var(--ink);

            text-shadow:
                0 1px 5px
                rgba(255,255,255,.8);

        }


        .time {

            margin-top: 5px;

            font-size:
                clamp(
                    16px,
                    2vw,
                    18px
                );

            font-style: italic;

            color:
                var(--rose);

            text-shadow:
                0 1px 4px
                rgba(255,255,255,.8);

        }


        /* ==================================================
           MENSAJE
        ================================================== */

        .message {

            width: 100%;

            max-width: 560px;

            margin:
                30px auto 0;

            font-size:
                clamp(
                    17px,
                    2.5vw,
                    21px
                );

            line-height: 1.7;

            color:
                var(--ink-soft);

            text-shadow:
                0 1px 5px
                rgba(255,255,255,.9);

        }


        /* ==================================================
           BOTÓN
        ================================================== */

        .button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            margin-top: 35px;

            min-height: 50px;

            padding:
                13px 32px;

            background:
                var(--gold);

            color: white;

            text-decoration: none;

            font-size: 17px;

            letter-spacing:
                0.07em;

            border:
                1px solid
                var(--gold);

            box-shadow:

                0 7px 20px
                rgba(80,55,20,.20);

            transition:
                all .3s ease;

        }


        .button:hover {

            background:
                #8d6a25;

            transform:
                translateY(-3px);

            box-shadow:

                0 12px 28px
                rgba(80,55,20,.25);

        }


        /* ==================================================
           DETALLES ANIME
        ================================================== */

        .anime {

            position: absolute;

            z-index: 12;

            color:
                var(--rose);

            opacity: .6;

            font-size:
                clamp(
                    20px,
                    3vw,
                    28px
                );

            text-shadow:
                0 1px 5px
                rgba(255,255,255,.7);

            animation:
                float 4s ease-in-out infinite;

        }


        .anime-one {

            top: 30%;

            left:
                clamp(
                    25px,
                    6vw,
                    70px
                );

        }


        .anime-two {

            top: 43%;

            right:
                clamp(
                    25px,
                    6vw,
                    70px
                );

            animation-delay:
                1.5s;

        }


        @keyframes float {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotate(0deg);

            }

            50% {

                transform:
                    translateY(-8px)
                    rotate(5deg);

            }

        }


        /* ==================================================
           TABLET
        ================================================== */

        @media (
            min-width: 601px
        )
        and
        (
            max-width: 900px
        ) {

            .welcome-card {

                width: 100%;

            }


            .content {

                padding-left:
                    50px;

                padding-right:
                    50px;

            }

        }


        /* ==================================================
           CELULARES
        ================================================== */

        @media (
            max-width: 600px
        ) {

            body {

                background:
                    var(--ivory);

            }


            .welcome-card {

                width: 100%;

                min-height: 100vh;

                margin: 0;

                box-shadow: none;

                /*
                 * En celulares la imagen
                 * sigue siendo el fondo de
                 * TODA la carta.
                 */

                background-size: cover;

                background-position: center;

            }


            .frame {

                inset: 9px;

            }


            .frame::before {

                inset: 5px;

            }


            .corner {

                width: 43px;

                height: 43px;

            }


            .content {

                min-height: 100vh;

                padding:

                    60px 25px

                    60px;

            }


            .small-title {

                font-size: 15px;

                letter-spacing:
                    .12em;

            }


            h1 {

                font-size:
                    clamp(
                        52px,
                        17vw,
                        70px
                    );

            }


            .amp {

                font-size:
                    35px;

            }


            .divider {

                width: 90%;

                margin:
                    25px auto;

            }


            .date {

                font-size: 18px;

            }


            .message {

                font-size: 17px;

                line-height: 1.6;

            }


            .button {

                width: 100%;

                max-width: 310px;

                margin-top: 30px;

            }


            .anime-one {

                top: 30px;

                left: 20px;

            }


            .anime-two {

                top: 30px;

                right: 20px;

            }

        }


        /* ==================================================
           CELULARES PEQUEÑOS
        ================================================== */

        @media (
            max-width: 380px
        ) {

            .content {

                padding:

                    55px 20px

                    50px;

            }


            h1 {

                font-size: 50px;

            }


            .message {

                font-size: 16px;

            }


            .button {

                font-size: 16px;

            }

        }


        /* ==================================================
           PANTALLAS GRANDES
        ================================================== */

        @media (
            min-width: 1200px
        ) {

            .welcome-card {

                margin:
                    30px auto;

                min-height:
                    calc(100vh - 60px);

            }


            .content {

                min-height:
                    calc(100vh - 60px);

            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         CARTA
    ================================================== -->

    <section class="welcome-card">


        <!-- Marco -->

        <div class="frame"></div>


        <!-- Esquinas -->

        <div class="corner top-left"></div>

        <div class="corner top-right"></div>

        <div class="corner bottom-left"></div>

        <div class="corner bottom-right"></div>


        <!-- ==================================================
             DECORACIÓN ANIME
        ================================================== -->

        <div class="anime anime-one">
            ✿
        </div>

        <div class="anime anime-two">
            ♡
        </div>


        <!-- ==================================================
             CONTENIDO
        ================================================== -->

        <div class="content">


            <p class="small-title">

                El día de nuestra boda

            </p>


            <h1>

                Vanesa

                <span class="amp">
                    &amp;
                </span>

                Diego Armando

            </h1>


            <!-- Divisor -->

            <div class="divider">

                <span class="line"></span>

                <span class="diamond"></span>

                <span class="line right"></span>

            </div>


            <!-- Fecha -->

            <p class="date">

                Sábado 14 de noviembre de 2026

            </p>


            <p class="time">

                1:00 pm

            </p>


            <!-- Mensaje -->

            <p class="message">

                Nos llena de alegría compartir
                contigo el comienzo de esta
                nueva historia de amor.

                <br><br>

                Acompáñanos en este día tan
                especial para nosotros.

            </p>


            <!-- Botón -->

            <a
                href="invitacion.html"
                class="button">

                Ver nuestra invitación

            </a>


        </div>


    </section>


</body>

</html>
